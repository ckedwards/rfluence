[package]
name = "rfluence-client"
version.workspace = true
description = "Confluence Cloud API client and credentials: the client behind rfluence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["confluence", "atlassian", "api", "client"]
categories = ["api-bindings"]
# The tests (and examples) use fixtures/ at the repository root, which isn't published.
exclude = ["tests/", "examples/"]

[dependencies]
base64.workspace = true
dirs.workspace = true
keyring-core.workspace = true
rfluence-convert.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

# The system keyring, per platform (design.md, "Auth").
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
mockito.workspace = true
