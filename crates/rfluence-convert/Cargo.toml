[package]
name = "rfluence-convert"
version.workspace = true
description = "Markdown <-> Confluence ADF conversion that round-trips: the converter behind rfluence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["confluence", "markdown", "adf", "atlassian"]
categories = ["text-processing", "parser-implementations"]
# The tests (and examples) use fixtures/ at the repository root, which isn't published.
exclude = ["tests/", "examples/"]

[dependencies]
comrak.workspace = true
emojis.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true

[dev-dependencies]
insta.workspace = true
similar-asserts.workspace = true
