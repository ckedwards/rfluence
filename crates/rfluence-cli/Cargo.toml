[package]
# Published as `rfluence`, so `cargo install rfluence` installs the command.
name = "rfluence"
version.workspace = true
description = "Confluence pages as markdown, both ways: fetch, search, edit and upload pages without losing content"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["confluence", "markdown", "atlassian", "cli", "documentation"]
categories = ["command-line-utilities", "text-processing"]
# The tests (and examples) use fixtures/ at the repository root, which isn't published.
exclude = ["tests/", "examples/"]

[[bin]]
name = "rfluence"
path = "src/main.rs"

[dependencies]
clap.workspace = true
globset.workspace = true
ignore.workspace = true
percent-encoding.workspace = true
rfluence-client.workspace = true
rfluence-convert.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true

[dev-dependencies]
base64.workspace = true
mockito.workspace = true
similar-asserts.workspace = true
