[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.55", default-features = false }
emojis = "0.9"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rfluence-convert = { path = "crates/rfluence-convert" }

insta = "1"
similar-asserts = "1"
